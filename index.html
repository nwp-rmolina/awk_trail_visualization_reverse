<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>AWK Trail Visualization (Reverse colour)</title>

    <!-- Load the ArcGIS Maps SDK for JavaScript from CDN -->
    <script type="module" src="https://js.arcgis.com/5.1/"></script>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #note {
        padding: 10px;
        width: 300px;
        font-size: var(--calcite-font-size);
      }
    </style>
  </head>

  <body>
    <div id="map-wrapper" style="position: relative; width: 100%; height: 100%;">
      <arcgis-map>
        <arcgis-zoom slot="top-left"></arcgis-zoom>
        <arcgis-expand slot="top-right" expand-icon="layers" expand-tooltip="Basemap selector">
          <arcgis-basemap-gallery></arcgis-basemap-gallery>
        </arcgis-expand>
      </arcgis-map>

      <div id="trail-layer-toggle-panel" style="position: absolute; top: 16px; left: 72px; z-index: 10; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.2); font-family: Arial, sans-serif; font-size: 14px;">
        <div style="font-weight: bold; margin-bottom: 8px;">Trail Categories</div>
      </div>

      <div id="scale-readout" style="position: absolute; right: 16px; bottom: 26px; z-index: 10; background: rgba(255,255,255,0.9); padding: 6px 10px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.2); font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; color: #333;">
        Scale: 1 : <span id="scale-value">50,000</span>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
